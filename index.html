<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escaping from the mother</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* أزرار التحكم للموبايل */
    .touch-controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 10px;
      z-index: 10000;
    }
    .btn {
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.5);
      border: 2px solid #fff;
      border-radius: 50%;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .btn:active { background: rgba(255, 255, 255, 0.9); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- أزرار اللمس -->
  <div class="touch-controls">
    <div class="btn" id="btn-up">⬆️</div>
    <div class="btn" id="btn-left">⬅️</div>
    <div class="btn" id="btn-down">⬇️</div>
    <div class="btn" id="btn-right">➡️</div>
  </div>

  <script>
    // إعداد المشهد والكاميرا
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);
    
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // إضافة الإضاءة
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 7.5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // إنشاء اللاعب
    const geometry = new THREE.BoxGeometry(1, 1, 1);
    const material = new THREE.MeshLambertMaterial({ color: 0x00ff00 });
    const player = new THREE.Mesh(geometry, material);
    scene.add(player);

    // أرضية اللعبة
    const grid = new THREE.GridHelper(50, 50);
    scene.add(grid);

    camera.position.set(0, 5, 10);
    camera.lookAt(player.position);

    // حالات الحركة
    const move = { up: false, down: false, left: false, right: false };

    // ربط أزرار اللمس بالموبايل
    const bindTouch = (id, direction) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); move[direction] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); move[direction] = false; });
      el.addEventListener('mousedown', () => move[direction] = true);
      el.addEventListener('mouseup', () => move[direction] = false);
    };

    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');

    // دعم لوحة المفاتيح
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') move.up = true;
      if (e.key === 'ArrowDown' || e.key === 's') move.down = true;
      if (e.key === 'ArrowLeft' || e.key === 'a') move.left = true;
      if (e.key === 'ArrowRight' || e.key === 'd') move.right = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') move.up = false;
      if (e.key === 'ArrowDown' || e.key === 's') move.down = false;
      if (e.key === 'ArrowLeft' || e.key === 'a') move.left = false;
      if (e.key === 'ArrowRight' || e.key === 'd') move.right = false;
    });

    // حلقة التحديث والحركة
    function animate() {
      requestAnimationFrame(animate);

      const speed = 0.1;
      if (move.up) player.position.z -= speed;
      if (move.down) player.position.z += speed;
      if (move.left) player.position.x -= speed;
      if (move.right) player.position.x += speed;

      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 10;

      renderer.render(scene, camera);
    }

    animate();

    // إعادة ضبط الشاشة عند التدوير
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
