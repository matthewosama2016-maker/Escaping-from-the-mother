<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الهروب 3D</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Tahoma, sans-serif;
            background-color: #111;
            color: #fff;
            user-select: none;
        }

        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .login-box {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 300px;
        }

        .login-box input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #333;
            color: #fff;
            font-size: 16px;
        }

        .login-box button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #00adb5;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .login-box button:hover {
            background: #00818a;
        }

        /* تحكم الموبايل والكمبيوتر */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 5;
        }

        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* تعديل أماكن الأزرار على الموبايل لتكون على الجنب عشان ماتعطلش الرؤية */
        @media (max-width: 768px) {
            #controls {
                bottom: 20px;
                left: 20px;
                transform: none;
                flex-direction: column;
                gap: 10px;
            }
            .ctrl-btn {
                width: 50px;
                height: 50px;
                font-size: 16px;
            }
        }
    </style>
    <!-- مكتبة Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-box">
            <h2>تسجيل الدخول</h2>
            <input type="text" id="username" placeholder="اسم اللاعب">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button id="login-btn">دخول وحفظ</button>
        </div>
    </div>

    <!-- أزرار التحكم -->
    <div id="controls">
        <div class="ctrl-btn" id="btn-up">⬆️</div>
        <div class="ctrl-btn" id="btn-down">⬇️</div>
        <div class="ctrl-btn" id="btn-left">⬅️</div>
        <div class="ctrl-btn" id="btn-right">➡️</div>
    </div>

    <script>
        // التحقق من الحفظ السابق في localStorage
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('game_username');
            if (savedUser) {
                document.getElementById('username').value = savedUser;
            }
        });

        // زر تسجيل الدخول والحفظ
        document.getElementById('login-btn').addEventListener('click', () => {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === '' || pass === '') {
                alert('الرجاء إدخال الاسم وكلمة المرور!');
                return;
            }

            // حفظ البيانات
            localStorage.setItem('game_username', user);
            localStorage.setItem('game_password', pass);

            // إخفاء شاشة تسجيل الدخول وبدء اللعبة
            document.getElementById('login-screen').style.display = 'none';
            initGame();
        });

        // إعداد لعبة Three.js الأساسية
        function initGame() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // مكعب تجريبي للعبة
            const geometry = new THREE.BoxGeometry();
            const material = new THREE.MeshBasicMaterial({ color: 0x00adb5 });
            const cube = new THREE.Mesh(geometry, material);
            scene.add(cube);

            camera.position.z = 5;

            // حركة بسيطة للتأكد من عمل اللعبة
            function animate() {
                requestAnimationFrame(animate);
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }
            animate();

            // إمكانية ربط أزرار التحكم بالحركة هنا لاحقاً
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
