<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الهروب من الأم - أونلاين</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            background-color: #111;
            color: #fff;
        }
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .btn {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            margin: 10px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background-color: #c0392b; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 5px;
            text-align: center;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 5;
            font-size: 18px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
    <!-- استدعاء مكتبة Three.js ومكتبة الاتصال PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>الهروب من الأم 🏃‍♂️</h1>
        <div id="room-section">
            <button class="btn" onclick="hostGame()">إنشاء غرفة جديدة</button>
            <br>
            <input type="text" id="join-code" placeholder="أدخل كود الصديق">
            <button class="btn" onclick="joinGame()">انضمام للغرفة</button>
        </div>
        <p id="status-msg" style="margin-top: 15px; color: #f39c12;"></p>
    </div>

    <div id="ui">
        المفاتيح المجمعة: <span id="keys-count">0</span> / 3
    </div>

    <script>
        // إعدادات اللعبة الأساسية بـ Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // إضاءة
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // أرضية
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // اللاعب
        const playerGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.y = 1;
        scene.add(player);

        camera.position.set(0, 5, 7);
        camera.lookAt(player.position);

        // متغيرات اللعبة والاتصال
        let keysCollected = 0;
        let peer, conn;
        let isHost = false;

        // حركة اللاعب الأساسية بأسهم الكيبورد
        const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };
        window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

        function updatePlayer() {
            const speed = 0.1;
            if (keys.ArrowUp) player.position.z -= speed;
            if (keys.ArrowDown) player.position.z += speed;
            if (keys.ArrowLeft) player.position.x -= speed;
            if (keys.ArrowRight) player.position.x += speed;

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 7;
            camera.lookAt(player.position);

            // إرسال الموقع للطرف الآخر لو متصلين
            if (conn && conn.open) {
                conn.send({ type: 'position', x: player.position.x, z: player.position.z });
            }
        }

        // --- نظام الاتصال الأونلاين (PeerJS) ---
        function hostGame() {
            isHost = true;
            peer = new Peer(); // إنشاء سيرفر اتصال مؤقت
            
            peer.on('open', (id) => {
                document.getElementById('status-msg').innerText = "كود غرفتك هو: " + id + " (أعطه لصديقك)";
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById('menu').style.display = 'none'; // بدء اللعبة وإخفاء القائمة
            });
        }

        function joinGame() {
            const code = document.getElementById('join-code').value.trim();
            if (!code) {
                alert("الرجاء إدخال الكود بشكل صحيح!");
                return;
            }

            peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect(code);
                setupConnection();
                document.getElementById('menu').style.display = 'none'; // بدء اللعبة وإخفاء القائمة
            });
        }

        function setupConnection() {
            conn.on('open', () => {
                console.log("تم الاتصال بنجاح!");
            });

            conn.on('data', (data) => {
                if (data.type === 'position') {
                    // هنا ممكن تحدث مكان اللاعب التاني لو حابب تضيف نموذج للاعب الضيف
                }
            });
        }

        // حلقة اللعبة الرئيسية (Animation Loop)
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderer.render(scene, camera);
        }
        animate();

        // التكيف مع حجم الشاشة
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
