<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الهروب 3D - أنالوج للموبايل وأونلاين 🎮</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background-color: #05050a; color: #fff; overflow: hidden; width: 100vw; height: 100vh; }
        #ui-container { position: absolute; top: 15px; right: 15px; left: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 10; pointer-events: none; }
        .info-panel { display: flex; gap: 10px; font-size: 0.85rem; background: rgba(15, 15, 25, 0.85); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255, 71, 87, 0.4); }
        
        #mic-status { position: absolute; top: 65px; left: 15px; background: rgba(46, 213, 115, 0.2); border: 1px solid #2ed573; color: #2ed573; padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; display: none; z-index: 10; }

        /* أزرار وعصا الأنالوج للموبايل */
        #mobile-controls { position: absolute; bottom: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 15; display: none; }
        #joystick-base { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; pointer-events: auto; }
        #joystick-stick { position: absolute; top: 37px; left: 37px; width: 56px; height: 56px; background: rgba(255,71,87,0.75); border-radius: 50%; pointer-events: none; transition: transform 0.05s linear; }
        
        .mob-btn { position: absolute; background: rgba(0,0,0,0.6); border: 2px solid rgba(255,255,255,0.4); color: white; border-radius: 50%; width: 55px; height: 55px; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; pointer-events: auto; cursor: pointer; }
        #btn-mob-jump { bottom: 40px; right: 30px; border-color: #2ed573; background: rgba(46,213,115,0.3); }
        #btn-mob-view { bottom: 110px; right: 30px; border-color: #70a1ff; background: rgba(112,161,255,0.3); font-size: 0.9rem; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, rgba(20, 20, 35, 0.96) 0%, rgba(5, 5, 10, 0.99) 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(16px); padding: 20px; border-radius: 16px; text-align: center; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        h1 { font-size: 1.4rem; color: #ff4757; margin-bottom: 10px; }
        p { color: #a4b0be; margin-bottom: 12px; font-size: 0.85rem; }
        input { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.4); color: #fff; text-align: center; outline: none; text-transform: uppercase; font-size: 0.9rem; }
        .btn { padding: 10px 16px; font-size: 0.85rem; font-weight: bold; background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; border: none; border-radius: 8px; cursor: pointer; margin: 3px; width: 100%; }
        .btn-secondary { background: #57606f; }
        .btn-green { background: linear-gradient(135deg, #2ed573, #26af5f); }
        .btn-mode { background: linear-gradient(135deg, #1e90ff, #70a1ff); }
        .code-display { font-size: 1.2rem; letter-spacing: 2px; color: #fffa65; font-weight: bold; margin: 8px 0; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 6px; border: 1px dashed #eccc68; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="ui-container">
        <div class="info-panel">
            <div>اللاعب: <span id="user-display" style="color:#70a1ff; font-weight:bold;">-</span></div>
            <div>المفاتيح: <span id="keys-count" style="color:#eccc68; font-weight:bold;">0</span> / 3</div>
        </div>
        <div class="info-panel">
            <div>المنظور: <span id="view-mode-display" style="color:#fffa65; font-weight:bold;">ثالث</span></div>
        </div>
    </div>

    <div id="mic-status">🎙️ المايك متصل</div>

    <!-- أنالوج التحكم الحقيقي للموبايل -->
    <div id="mobile-controls">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <div class="mob-btn" id="btn-mob-jump" onclick="triggerJump()">🦘</div>
        <div class="mob-btn" id="btn-mob-view" onclick="toggleView()">🎥</div>
    </div>

    <!-- تسجيل الدخول -->
    <div id="login-modal" class="modal-overlay">
        <div class="card">
            <h1>تسجيل الدخول 🔐</h1>
            <p>أدخل اسمك لبدء اللعبة فوراً!</p>
            <input type="text" id="username-input" placeholder="اسم اللاعب">
            <button class="btn" onclick="login()">دخول 🚀</button>
        </div>
    </div>

    <!-- القائمة الرئيسية -->
    <div id="menu-modal" class="modal-overlay" style="display: none;">
        <div class="card">
            <h1>الهروب من الأم 🎮</h1>
            <p>مرحباً بك <b id="welcome-user" style="color:#70a1ff;"></b>!</p>
            <button class="btn btn-mode" onclick="startSinglePlayer()">لعب فردي 👤</button>
            <button class="btn btn-green" onclick="showMultiplayer()">لعب جماعي + مايك 🤝🎙️</button>
        </div>
    </div>

    <!-- شاشة الأونلاين -->
    <div id="multiplayer-modal" class="modal-overlay" style="display: none;">
        <div class="card">
            <h1>لعب جماعي عابر للأجهزة 🤝🎙️</h1>
            <p id="peer-status" style="color:#eccc68;">جاري الاتصال بالسيرفر...</p>
            <button class="btn btn-green" onclick="createRoom()">إنشاء غرفة جديدة 🏠</button>
            
            <div id="room-info" style="display:none; margin-top:10px;">
                <div class="code-display" id="room-code-text">----</div>
                <p style="color:#fffa65; font-size:0.75rem;">انسخ الكود وأعطه لصديقك (موبايل أو لابتوب)</p>
                <button class="btn btn-mode" id="btn-start-multi" style="display:none;" onclick="startMultiplayerGame()">ابدأ اللعبة سوياً 🚀</button>
            </div>
            
            <hr style="margin: 12px 0; opacity: 0.2;">
            <input type="text" id="join-code-input" placeholder="أدخل كود صديقك هنا">
            <button class="btn btn-mode" onclick="joinRoom()">انضمام للغرفة 🚀</button>
            <button class="btn btn-secondary" onclick="backToMenu()">رجوع</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        window.addEventListener('click', initAudio, { once: true });
        window.addEventListener('touchstart', initAudio, { once: true });

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'key') {
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(660, now + 0.1);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        let username = "";
        let peer = null, connection = null, isMultiplayer = false;
        let scene, camera, renderer, momMesh, playerMesh, otherPlayerMesh;
        let keysObjects = [];
        let player = { x: 50, y: 0, z: 50, speed: 0.25, yaw: 0, pitch: 0 };
        let mom = { x: -50, z: -50, speed: 0.07 };
        let door = { x: 0, z: -60 }, doorMesh;
        let collectedKeys = 0, targetKeysCount = 3;
        let isThirdPerson = true, gameActive = false;

        // متغيرات الأنالوج واللمس
        let joystickActive = false, joystickX = 0, joystickY = 0;
        let lastTouchX = 0, lastTouchY = 0;

        function login() {
            username = document.getElementById('username-input').value.trim();
            if (!username) return alert('أدخل اسمك!');
            document.getElementById('user-display').innerText = username;
            document.getElementById('welcome-user').innerText = username;
            document.getElementById('login-modal').style.display = 'none';
            document.getElementById('menu-modal').style.display = 'flex';
            initPeer();
        }

        function initPeer() {
            peer = new Peer('escgame-' + Math.floor(Math.random() * 100000));
            peer.on('open', () => document.getElementById('peer-status').innerText = "🟢 جاهز للربط بين الأجهزة!");
            peer.on('call', call => {
                navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
                    call.answer(stream);
                    call.on('stream', rStream => playVoice(rStream));
                }).catch(e => console.log(e));
            });
            peer.on('connection', conn => {
                connection = conn; setupConnectionEvents();
                document.getElementById('btn-start-multi').style.display = 'block';
                startMic(conn.peer);
            });
        }

        function startMic(remoteId) {
            navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
                let call = peer.call(remoteId, stream);
                call.on('stream', rStream => playVoice(rStream));
                document.getElementById('mic-status').style.display = 'block';
            }).catch(e => console.log(e));
        }

        function playVoice(stream) {
            const audio = document.createElement('audio');
            audio.srcObject = stream; audio.autoplay = true; audio.play();
            document.getElementById('mic-status').style.display = 'block';
        }

        function createRoom() {
            isMultiplayer = true;
            document.getElementById('room-code-text').innerText = peer.id;
            document.getElementById('room-info').style.display = 'block';
        }

        function joinRoom() {
            let code = document.getElementById('join-code-input').value.trim();
            if (!code) return alert('أدخل الكود!');
            isMultiplayer = true;
            connection = peer.connect(code);
            setupConnectionEvents();
            startMic(code);
        }

        function setupConnectionEvents() {
            connection.on('open', () => document.getElementById('peer-status').innerText = "🟢 تم الاتصال بنجاح!");
            connection.on('data', data => {
                if (data.type === 'start') { hideModals(); startGame(); }
                if (data.type === 'pos' && otherPlayerMesh) {
                    otherPlayerMesh.position.set(data.x, data.y, data.z);
                    otherPlayerMesh.rotation.y = data.yaw;
                }
            });
        }

        function startMultiplayerGame() {
            if (!connection) return alert('في انتظار اتصال الصديق!');
            connection.send({ type: 'start' });
            hideModals(); startGame();
        }

        function showMultiplayer() { document.getElementById('menu-modal').style.display = 'none'; document.getElementById('multiplayer-modal').style.display = 'flex'; }
        function backToMenu() { document.getElementById('multiplayer-modal').style.display = 'none'; document.getElementById('menu-modal').style.display = 'flex'; }
        function startSinglePlayer() { isMultiplayer = false; hideModals(); startGame(); }
        function hideModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none'); }

        function init3D() {
            scene = new THREE.Scene(); scene.background = new THREE.Color(0x05050a);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000); camera.rotation.order = 'YXZ';
            renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            let dLight = new THREE.DirectionalLight(0xffffff, 0.8); dLight.position.set(20, 40, 20); scene.add(dLight);

            let floor = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), new THREE.MeshStandardMaterial({ color: 0x1e272e }));
            floor.rotation.x = -Math.PI / 2; scene.add(floor);

            let wallMat = new THREE.MeshStandardMaterial({ color: 0x485460 });
            scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(150, 15, 3), wallMat), { position: { x: 0, y: 7.5, z: -75 } }));
            scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(150, 15, 3), wallMat), { position: { x: 0, y: 7.5, z: 75 } }));
            scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(3, 15, 150), wallMat), { position: { x: -75, y: 7.5, z: 0 } }));
            scene.add(Object.assign(new THREE.Mesh(new THREE.BoxGeometry(3, 15, 150), wallMat), { position: { x: 75, y: 7.5, z: 0 } }));

            // اللاعب
            playerMesh = new THREE.Group();
            let body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5), new THREE.MeshStandardMaterial({ color: 0x0984e3 })); body.position.y = 0.75;
            let head = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({ color: 0xffdc34 })); head.position.y = 1.6;
            playerMesh.add(body, head); scene.add(playerMesh);

            // اللاعب الثاني (أونلاين)
            otherPlayerMesh = new THREE.Group();
            let oBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.5), new THREE.MeshStandardMaterial({ color: 0x00b894 })); oBody.position.y = 0.75;
            let oHead = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshStandardMaterial({ color: 0xffdc34 })); oHead.position.y = 1.6;
            otherPlayerMesh.add(oBody, oHead); otherPlayerMesh.visible = false; scene.add(otherPlayerMesh);

            // الأم
            momMesh = new THREE.Group();
            let mBody = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 1.2, 3), new THREE.MeshStandardMaterial({ color: 0xd63031 })); mBody.position.y = 1.5;
            let mHead = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshStandardMaterial({ color: 0xffdc34 })); mHead.position.y = 3.2;
            momMesh.add(mBody, mHead); scene.add(momMesh);

            // الباب
            doorMesh = new THREE.Mesh(new THREE.BoxGeometry(4, 6, 0.5), new THREE.MeshStandardMaterial({ color: 0x70a1ff }));
            doorMesh.position.set(door.x, 3, door.z); scene.add(doorMesh);

            setupJoystick();
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function setupJoystick() {
            const base = document.getElementById('joystick-base');
            const stick = document.getElementById('joystick-stick');
            let rect = base.getBoundingClientRect();

            base.addEventListener('touchstart', e => { joystickActive = true; updateStick(e.touches[0]); });
            base.addEventListener('touchmove', e => { if (joystickActive) updateStick(e.touches[0]); });
            base.addEventListener('touchend', () => {
                joystickActive = false; joystickX = 0; joystickY = 0;
                stick.style.transform = `translate(0px, 0px)`;
            });

            function updateStick(t) {
                rect = base.getBoundingClientRect();
                let dx = t.clientX - (rect.left + rect.width / 2);
                let dy = t.clientY - (rect.top + rect.height / 2);
                let dist = Math.hypot(dx, dy);
                let maxD = 40;
                if (dist > maxD) { dx = (dx / dist) * maxD; dy = (dy / dist) * maxD; }
                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                joystickX = dx / maxD; joystickY = dy / maxD;
            }

            // تحريك الكاميرا باللمس على الشاشة للموبايل
            window.addEventListener('touchstart', e => {
                if (e.target.closest('#mobile-controls') || e.target.closest('.modal-overlay')) return;
                lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
            });
            window.addEventListener('touchmove', e => {
                if (e.target.closest('#mobile-controls') || e.target.closest('.modal-overlay')) return;
                let dx = e.touches[0].clientX - lastTouchX;
                let dy = e.touches[0].clientY - lastTouchY;
                player.yaw -= dx * 0.005;
                player.pitch -= dy * 0.005;
                player.pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, player.pitch));
                lastTouchX = e.touches[0].clientX; lastTouchY = e.touches[0].clientY;
            });
        }

        function startGame() {
            collectedKeys = 0;
            document.getElementById('keys-count').innerText = collectedKeys;
            document.getElementById('mobile-controls').style.display = 'block';
            spawnKeys();
            gameActive = true;
            animate();
        }

        function spawnKeys() {
            keysObjects.forEach(k => scene.remove(k.mesh)); keysObjects = [];
            let geom = new THREE.TorusGeometry(0.5, 0.15, 8, 16);
            let mat = new THREE.MeshStandardMaterial({ color: 0xf1c40f });
            for (let i = 0; i < targetKeysCount; i++) {
                let m = new THREE.Mesh(geom, mat);
                m.position.set((Math.random() - 0.5) * 120, 1, (Math.random() - 0.5) * 120);
                scene.add(m); keysObjects.push({ mesh: m, collected: false });
            }
        }

        function triggerJump() { player.y = 5; setTimeout(() => player.y = 0, 500); }
        function toggleView() { isThirdPerson = !isThirdPerson; document.getElementById('view-mode-display').innerText = isThirdPerson ? 'ثالث' : 'أول'; }

        function animate() {
            if (!gameActive) return;
            requestAnimationFrame(animate);

            // حركة الأنالوج
            if (joystickX !== 0 || joystickY !== 0) {
                let moveX = Math.sin(player.yaw) * (-joystickY) + Math.cos(player.yaw) * joystickX;
                let moveZ = Math.cos(player.yaw) * (-joystickY) - Math.sin(player.yaw) * joystickX;
                player.x = Math.max(-70, Math.min(70, player.x + moveX * player.speed));
                player.z = Math.max(-70, Math.min(70, player.z + moveZ * player.speed));
            }

            // موقع الكاميرا
            if (isThirdPerson) {
                let cx = player.x + Math.sin(player.yaw) * 7;
                let cz = player.z + Math.cos(player.yaw) * 7;
                camera.position.set(cx, player.y + 3.5, cz);
                camera.lookAt(player.x, player.y + 1, player.z);
            } else {
                camera.position.set(player.x, player.y + 1.5, player.z);
                camera.rotation.y = player.yaw; camera.rotation.x = player.pitch;
            }

            playerMesh.position.set(player.x, player.y, player.z);
            playerMesh.rotation.y = player.yaw;

            if (isMultiplayer && connection && connection.open) {
                connection.send({ type: 'pos', x: player.x, y: player.y, z: player.z, yaw: player.yaw });
            }

            // حركة الأم
            let dx = player.x - mom.x, dz = player.z - mom.z;
            let dist = Math.hypot(dx, dz);
            if (dist > 0.5) {
                mom.x += (dx / dist) * mom.speed;
                mom.z += (dz / dist) * mom.speed;
            }
            momMesh.position.set(mom.x, 0, mom.z);

            if (dist < 2.0) {
                gameActive = false;
                alert('مسكتك الأم! 🩴 خسرت.');
                location.reload();
            }

            // جمع المفاتيح
            keysObjects.forEach(k => {
                if (!k.collected && Math.hypot(player.x - k.mesh.position.x, player.z - k.mesh.position.z) < 2) {
                    k.collected = true; scene.remove(k.mesh);
                    collectedKeys++; playSound('key');
                    document.getElementById('keys-count').innerText = collectedKeys;
                }
            });

            if (collectedKeys >= targetKeysCount && Math.hypot(player.x - door.x, player.z - door.z) < 3) {
                gameActive = false;
                alert('مبروك فزت وهربت من البيت! 🎉');
                location.reload();
            }

            renderer.render(scene, camera);
        }

        window.onload = init3D;
    </script>
</body>
</html>
