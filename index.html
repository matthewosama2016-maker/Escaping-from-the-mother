<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Escaping from the mother</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 10px; left: 10px; color: white;
      font-size: 18px; font-weight: bold; background: rgba(0,0,0,0.6);
      padding: 10px 15px; border-radius: 8px; z-index: 10;
    }
    .touch-controls {
      position: fixed; bottom: 20px; left: 20px;
      display: grid; grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px); gap: 10px; z-index: 10000;
    }
    .btn {
      width: 60px; height: 60px; background: rgba(255, 255, 255, 0.4);
      border: 2px solid #fff; border-radius: 50%; font-size: 24px;
      display: flex; align-items: center; justify-content: center;
      touch-action: manipulation; color: white;
    }
    .btn:active { background: rgba(255, 255, 255, 0.8); }
    #btn-up { grid-column: 2; grid-row: 1; }
    #btn-left { grid-column: 1; grid-row: 2; }
    #btn-down { grid-column: 2; grid-row: 2; }
    #btn-right { grid-column: 3; grid-row: 2; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="ui">
    <div>الدرجة/المستوى: <span id="level">1</span></div>
    <div>المفاتيح المطلوبة: <span id="keys">0</span> / 3</div>
  </div>

  <div id="canvas-container"></div>

  <!-- أزرار الموبايل -->
  <div class="touch-controls">
    <div class="btn" id="btn-up">⬆️</div>
    <div class="btn" id="btn-left">⬅️</div>
    <div class="btn" id="btn-down">⬇️</div>
    <div class="btn" id="btn-right">➡️</div>
  </div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const light = new THREE.PointLight(0xffffff, 1, 100);
    light.position.set(0, 10, 0);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x333333));

    // الأرضية
    const floorGeo = new THREE.PlaneGeometry(60, 60);
    const floorMat = new THREE.MeshBasicMaterial({ color: 0x222222, side: THREE.DoubleSide });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = Math.PI / 2;
    scene.add(floor);

    // اللاعب (الأزرق)
    const playerGeo = new THREE.BoxGeometry(1, 1.8, 1);
    const playerMat = new THREE.MeshBasicMaterial({ color: 0x0088ff });
    const player = new THREE.Mesh(playerGeo, playerMat);
    player.position.y = 0.9;
    scene.add(player);

    // الأم (الأحمر)
    const motherGeo = new THREE.BoxGeometry(1.2, 2, 1.2);
    const motherMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const mother = new THREE.Mesh(motherGeo, motherMat);
    mother.position.set(20, 1, 20);
    scene.add(mother);

    // المفاتيح
    let keysCollected = 0;
    let currentLevel = 1;
    const keysArray = [];
    
    function spawnKeys() {
      keysArray.forEach(k => scene.remove(k));
      keysArray.length = 0;
      for(let i=0; i<3; i++) {
        const keyGeo = new THREE.SphereGeometry(0.4, 8, 8);
        const keyMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
        const key = new THREE.Mesh(keyGeo, keyMat);
        key.position.set((Math.random() - 0.5) * 40, 0.5, (Math.random() - 0.5) * 40);
        scene.add(key);
        keysArray.push(key);
      }
    }
    spawnKeys();

    camera.position.set(0, 5, 8);

    // الحركة والتحكم
    const move = { up: false, down: false, left: false, right: false };

    const bindTouch = (id, dir) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); move[dir] = true; });
      el.addEventListener('touchend', (e) => { e.preventDefault(); move[dir] = false; });
      el.addEventListener('mousedown', () => move[dir] = true);
      el.addEventListener('mouseup', () => move[dir] = false);
    };

    bindTouch('btn-up', 'up');
    bindTouch('btn-down', 'down');
    bindTouch('btn-left', 'left');
    bindTouch('btn-right', 'right');

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'w', 'W'].includes(e.key)) move.up = true;
      if (['ArrowDown', 's', 'S'].includes(e.key)) move.down = true;
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) move.left = true;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) move.right = right;
    });

    window.addEventListener('keyup', (e) => {
      if (['ArrowUp', 'w', 'W'].includes(e.key)) move.up = false;
      if (['ArrowDown', 's', 'S'].includes(e.key)) move.down = false;
      if (['ArrowLeft', 'a', 'A'].includes(e.key)) move.left = false;
      if (['ArrowRight', 'd', 'D'].includes(e.key)) move.right = false;
    });

    function animate() {
      requestAnimationFrame(animate);

      // حركة اللاعب
      const speed = 0.15;
      if (move.up) player.position.z -= speed;
      if (move.down) player.position.z += speed;
      if (move.left) player.position.x -= speed;
      if (move.right) player.position.x += speed;

      // مطاردة الأم للاعب
      const motherSpeed = 0.03 + (currentLevel * 0.01);
      mother.position.x += (player.position.x - mother.position.x) * motherSpeed;
      mother.position.z += (player.position.z - mother.position.z) * motherSpeed;

      // التقاط المفاتيح
      keysArray.forEach((key, index) => {
        if (player.position.distanceTo(key.position) < 1.2) {
          scene.remove(key);
          keysArray.splice(index, 1);
          keysCollected++;
          document.getElementById('keys').innerText = keysCollected;

          if (keysCollected >= 3) {
            alert('مبروك! جمعت المفاتيح وانتقلت للمستوى التالي');
            currentLevel++;
            keysCollected = 0;
            document.getElementById('level').innerText = currentLevel;
            document.getElementById('keys').innerText = 0;
            player.position.set(0, 0.9, 0);
            mother.position.set(20, 1, 20);
            spawnKeys();
          }
        }
      });

      // الإمساك باللاعب
      if (player.position.distanceTo(mother.position) < 1.2) {
        alert('الأم مسكتك! حاول مرة أخرى');
        player.position.set(0, 0.9, 0);
        mother.position.set(20, 1, 20);
        keysCollected = 0;
        document.getElementById('keys').innerText = 0;
        spawnKeys();
      }

      // الكاميرا تتبع اللاعب
      camera.position.x = player.position.x;
      camera.position.z = player.position.z + 8;
      camera.lookAt(player.position.x, player.position.y + 1, player.position.z);

      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
